<section class="rounded-3xl border border-border-soft bg-white p-8 text-center shadow-sm max-sm:p-6">
  <p class="mb-1 text-xs font-semibold tracking-wider text-sun uppercase">Antes de empezar</p>
  <h2 class="font-display text-2xl font-bold tracking-tight text-ink">¿Cómo quieres hablar con Custodio?</h2>
  <p class="mx-auto mt-2 max-w-[46ch] text-sm text-ink-soft">
    Elige si prefieres escribirle o tener una conversación de voz completa, donde hasta los aportes de personalidad se los dictas hablando.
  </p>

  <div class="mt-7 grid grid-cols-2 gap-4 max-sm:grid-cols-1">
    <button
      type="button"
      class="group flex flex-col items-center gap-3 rounded-2xl border border-border-soft bg-paper p-6 transition-colors hover:border-sea hover:bg-white"
      routerLink="/texto"
    >
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-sea-deep/10 text-sea-deep transition-colors group-hover:bg-sea-deep group-hover:text-white">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </span>
      <span class="font-display text-base font-semibold text-ink">Chat de texto</span>
      <span class="text-center text-xs leading-relaxed text-ink-soft">
        Escríbele a Custodio y decide tú cuándo escuchar sus respuestas en voz.
      </span>
    </button>

    <button
      type="button"
      class="group flex flex-col items-center gap-3 rounded-2xl border border-border-soft bg-paper p-6 transition-colors hover:border-coral hover:bg-white disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:border-border-soft disabled:hover:bg-paper"
      [disabled]="!voice.micSupported()"
      routerLink="/voz"
    >
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-coral/10 text-coral transition-colors group-hover:bg-coral group-hover:text-white">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </span>
      <span class="font-display text-base font-semibold text-ink">Chat de voz</span>
      <span class="text-center text-xs leading-relaxed text-ink-soft">
        Habla con Custodio y dicta también tus aportes de personalidad por voz.
      </span>
      @if (!voice.micSupported()) {
        <span class="text-[11px] text-coral-dark italic">Tu navegador no soporta reconocimiento de voz (usa Chrome).</span>
      }
    </button>
  </div>
</section>
