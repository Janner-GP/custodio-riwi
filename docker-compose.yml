services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: '["http://localhost:4200"]'
      DATA_DIR: /data
    volumes:
      - custodio-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  custodio-data:
