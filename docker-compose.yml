services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: '["https://custodio-app.riwi.io"]'
      DATA_DIR: /data
    volumes:
      - custodio-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4200:80"
    restart: unless-stopped

volumes:
  custodio-data: